# qbrowser's own icons, for what the framework's set has no glyph for. Every icon has all three
# glyphs, so each shows whatever the terminal can draw.

[meta]
name = "qbrowser"

[icons]
# nf-md-refresh
"browser.reload" = { nerd = "\U000F0450", unicode = "⟳", ascii = "R" }
# nf-md-star_outline: the page is not a bookmark
"browser.star" = { nerd = "\U000F04D2", unicode = "☆", ascii = "+" }
# nf-md-star: the page is a bookmark
"browser.starred" = { nerd = "\U000F04CE", unicode = "★", ascii = "*" }
