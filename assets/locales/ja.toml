[browser.address]
label = "アドレス"
placeholder = "検索するかアドレスを入力"

[browser.profile]
temporary = "一時プロファイル"
temporary-explained = "別の qbrowser がプロファイルを使用中のため、このウィンドウは専用のプロファイルを使います。Cookie やログイン情報は閉じると削除されます。"

[browser.chromium]
missing = "Chromium が見つかりません"
missing-message = "qbrowser は Chromium でウェブページを描画しますが、このコンピュータにはインストールされていません。"
install = "ここにインストール"
show-command = "コマンドを表示"
command = "このコマンドで Chromium をインストールします:"
still-missing = "Chromium がまだ見つかりません。別の場所にインストールした場合は、QBROW_CHROMIUM にそのパスを設定してください。"
unknown-system = "qbrowser はこのシステムでのプログラムのインストール方法を把握していません。お使いのシステムの方法で Chromium か Chrome をインストールするか、QBROW_CHROMIUM にそのパスを設定してから、qbrowser をもう一度起動してください。"
failed = "Chromium を起動できませんでした"
stopped = "Chromium が停止しました"
reason = "最後のメッセージ: {reason}"
restart = "再起動"

[browser.page]
cannot-show = "この端末では画像を表示できません"
cannot-show-message = "qbrowser はウェブページを画像として表示します。256色以上に対応した端末で表示でき、kitty グラフィックスプロトコルや sixel に対応した端末では鮮明に表示されます。"

[browser.cli]
help = """
qbrow {version}: ターミナルで動く本物のウェブブラウザ

使用法: qbrow [ADDRESS]

  ADDRESS            ウェブアドレス、このコンピュータ上のファイル、または
                     DuckDuckGo で検索する語句。指定しない場合、qbrowser は空のタブを開きます。
  --profile FOLDER   Cookie やログイン情報を通常の場所ではなく FOLDER に保存します
  --version          バージョンを表示します
  --help             このヘルプを表示します

qbrowser は Chromium か Chrome でページを描画します。PATH か QBROW_CHROMIUM から探します。
起動時に1日1回、crates.io に新しいバージョンがあるか問い合わせます。設定で無効にできます。"""
unknown = "qbrow: 不明なオプション {argument} です。qbrow --help を参照してください"
no-profile-folder = "qbrow: --profile の後にはフォルダーを指定してください"

[keys]
