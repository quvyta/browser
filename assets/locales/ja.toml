[browser.cli]
help = """
qbrow {version}: ターミナルで動く本物のウェブブラウザ

使用法: qbrow [ADDRESS]

  ADDRESS            ウェブアドレス、このコンピュータ上のファイル、または
                     DuckDuckGo で検索する語句。指定しない場合、qbrow は空のタブを開きます。
  --profile FOLDER   Cookie やログイン情報を通常の場所ではなく FOLDER に保存します
  --version          バージョンを表示します
  --help             このヘルプを表示します

qbrow は Chromium か Chrome でページを描画します。PATH か QBROW_CHROMIUM から探します。
起動時に1日1回、crates.io に新しいバージョンがあるか問い合わせます。設定で無効にできます。"""
unknown = "qbrow: 不明なオプション {argument} です。qbrow --help を参照してください"
no-profile-folder = "qbrow: --profile の後にはフォルダーを指定してください"

