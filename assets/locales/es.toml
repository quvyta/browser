[browser.cli]
help = """
qbrow {version}: un navegador de verdad en la terminal

Uso: qbrow [DIRECCIÓN]

  DIRECCIÓN          una dirección web, un archivo de este equipo o palabras que buscar con
                     DuckDuckGo. Sin ella, qbrowser abre una pestaña vacía.
  --profile CARPETA  guarda cookies e inicios de sesión en CARPETA en vez del lugar habitual
  --version          muestra la versión
  --help             muestra esta ayuda

qbrowser dibuja las páginas con Chromium o Chrome, que busca en PATH o en QBROW_CHROMIUM.
Una vez al día, al arrancar, qbrowser pregunta a crates.io si hay una versión más nueva; puedes desactivarlo en los ajustes."""
unknown = "qbrow: opción desconocida {argument}; consulta qbrow --help"
no-profile-folder = "qbrow: --profile necesita una carpeta después"

