[browser.page]
cannot-show = "This terminal cannot show pictures"
cannot-show-message = "qbrowser shows web pages as pictures. A terminal with 256 colours or more shows them, and one that speaks the kitty graphics protocol or sixel shows them sharp."

[browser.cli]
help = """
qbrow {version}: a real web browser in the terminal

Usage: qbrow [ADDRESS]

  ADDRESS            a web address, a file on this computer, or words to search for with
                     DuckDuckGo. Without one qbrowser opens an empty tab.
  --profile FOLDER   keep cookies and sign-ins in FOLDER instead of the usual place
  --version          print the version
  --help             print this help

qbrowser draws pages with Chromium or Chrome, found on PATH or at QBROW_CHROMIUM.
Once a day at start qbrowser asks crates.io whether a newer version is out; turn it off in the settings."""
unknown = "qbrow: unknown option {argument}; see qbrow --help"
no-profile-folder = "qbrow: --profile needs a folder after it"

