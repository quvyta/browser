[browser.cli]
help = """
qbrow {version}: terminalde gerçek bir web tarayıcısı

Kullanım: qbrow [ADRES]

  ADRES              bir web adresi, bu bilgisayardaki bir dosya ya da DuckDuckGo'da
                     aranacak sözcükler. Verilmezse qbrow boş bir sekme açar.
  --profile KLASÖR   çerezleri ve oturumları her zamanki yer yerine KLASÖR'de tutar
  --version          sürümü yazar
  --help             bu yardımı yazar

qbrow sayfaları Chromium ya da Chrome ile çizer; onu PATH'te ya da QBROW_CHROMIUM'da arar.
qbrow açılışta günde en fazla bir kez crates.io'ya yeni bir sürüm olup olmadığını sorar; ayarlardan kapatılabilir."""
unknown = "qbrow: bilinmeyen seçenek {argument}; qbrow --help yazıp bakabilirsin"
