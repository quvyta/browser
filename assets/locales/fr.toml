[browser.cli]
help = """
qbrow {version} : un vrai navigateur web dans le terminal

Utilisation : qbrow [ADRESSE]

  ADRESSE            une adresse web, un fichier sur cet ordinateur, ou des mots à rechercher
                     avec DuckDuckGo. Sans argument, qbrowser ouvre un onglet vide.
  --profile DOSSIER  conserve les cookies et connexions dans DOSSIER plutôt qu’à l’emplacement habituel
  --version          affiche la version
  --help             affiche cette aide

qbrowser affiche les pages avec Chromium ou Chrome, trouvés dans le PATH ou à QBROW_CHROMIUM.
Une fois par jour au démarrage, qbrowser demande à crates.io si une nouvelle version est sortie ; désactivez-le dans les paramètres."""
unknown = "qbrow : option inconnue {argument} ; consultez qbrow --help"
no-profile-folder = "qbrow : --profile nécessite un dossier après lui"

