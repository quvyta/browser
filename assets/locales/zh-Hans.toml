[browser.cli]
help = """
qbrow {version}：终端里的真正网页浏览器

用法: qbrow [ADDRESS]

  ADDRESS            一个网址、本机上的文件，或用 DuckDuckGo 搜索的词语。
                     不带参数时 qbrow 打开一个空白标签页。
  --profile FOLDER   把 cookie 和登录状态保存在 FOLDER，而不是默认位置
  --version          打印版本号
  --help             打印这份帮助

qbrow 用 Chromium 或 Chrome 渲染页面，从 PATH 或 QBROW_CHROMIUM 查找。
每天启动时 qbrow 会询问 crates.io 是否有新版本；可在设置中关闭。"""
unknown = "qbrow：未知选项 {argument}；请查看 qbrow --help"
