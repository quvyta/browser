[browser.cli]
help = """
qbrow {version}: ein echter Webbrowser im Terminal

Aufruf: qbrow [ADRESSE]

  ADRESSE            eine Webadresse, eine Datei auf diesem Computer oder Suchbegriffe für
                     DuckDuckGo. Ohne Angabe öffnet qbrow einen leeren Tab.
  --profile ORDNER   Cookies und Anmeldungen in ORDNER statt am üblichen Ort speichern
  --version          die Version ausgeben
  --help             diese Hilfe ausgeben

qbrow stellt Seiten mit Chromium oder Chrome dar, gefunden in PATH oder unter QBROW_CHROMIUM.
Einmal täglich fragt qbrow beim Start crates.io nach einer neueren Version; abschaltbar in den Einstellungen."""
unknown = "qbrow: unbekannte Option {argument}; siehe qbrow --help"
no-profile-folder = "qbrow: hinter --profile muss ein Ordner stehen"

