[package]
name = "quvyta-browser"
description = "A real web browser inside the terminal: an unmodified Chromium draws the pages, tabs and the address bar are the terminal's own"
repository = "https://github.com/quvyta/browser"
homepage = "https://quvyta.com/qbrowser/"
readme = "README.md"
keywords = ["tui", "terminal", "browser", "web", "chromium"]
categories = ["command-line-utilities", "web-programming"]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
# Only what the program is built from goes into the package; the rest of the repository is for
# working on it.
include = ["/src/**", "/assets/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[lib]
name = "qbrowser"
path = "src/lib.rs"

[dependencies]
quvyta-framework = { version = "0.1.27", features = ["image", "updates"] }
# Only 127.0.0.1 is ever reached through it, so no TLS.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
serde_json = "1"
base64 = "0.22"
# The same version the framework brings in, so it adds no crate; read for the cell's pixel size.
crossterm = "0.29.0"

[dev-dependencies]
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cast_lossless = "deny"
needless_pass_by_value = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
uninlined_format_args = "deny"
