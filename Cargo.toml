[package]
name = "quvyta-browser"
description = "A real web browser inside the terminal: an unmodified Chromium draws the pages, tabs and the address bar are the terminal's own"
repository = "https://github.com/quvyta/browser"
homepage = "https://quvyta.com/qbrowser/"
readme = "README.md"
keywords = ["tui", "terminal", "browser", "web", "chromium"]
categories = ["command-line-utilities", "web-programming"]
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
# Only what the program is built from goes into the package; the rest of the repository is for
# working on it.
include = ["/src/**", "/assets/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[lib]
name = "qbrowser"
path = "src/lib.rs"

[dependencies]
quvyta-framework = { version = "0.1.33", features = ["image", "updates"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
# Sending a signal without `unsafe`, which the crate forbids. crossterm and the framework
# already bring this exact version in, so naming it adds no crate.
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

# Every picture of the page passes through the JPEG decoder, and in full-pixel terminals through
# zlib, on its way to the screen. Unoptimised, as `cargo run` and the tests build them, one frame
# of a large window took over a second, so the page seemed not to scroll at all; optimised it takes
# a few milliseconds. Only the dependencies are optimised: qbrowser's own code stays quick to build
# and easy to debug.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"
# Set by build.rs when the Chromium the tests drive is on this machine; the tests that need it are
# ignored without it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(chromium)"] }
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cast_lossless = "deny"
needless_pass_by_value = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
uninlined_format_args = "deny"
